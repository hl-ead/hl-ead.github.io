  <script>
    (function() {
      'use strict';

      // ────────────────────────────────────────────────────────────
      // DATOS
      // ────────────────────────────────────────────────────────────
      const BOM_DATA_RAW = [
        // --- Cañón Gauss ---
        { ref: 'C1-C3', qty: 3, value: '4700μF/63V', desc: 'Capacitor polarizado (Electrolítico)', cat: 'Almacenamiento', proyecto: 'Cañón Gauss' },
        { ref: 'C4', qty: 1, value: '47nF', desc: 'Capacitor no polarizado', cat: 'Pasivos', proyecto: 'Cañón Gauss' },
        { ref: 'C5,C6', qty: 2, value: '100nF', desc: 'Capacitor no polarizado', cat: 'Pasivos', proyecto: 'Cañón Gauss' },
        { ref: 'D2,D7', qty: 2, value: 'BOARD LED', desc: 'Diodo emisor de luz (LED) indicador de placa', cat: 'Interfaz', proyecto: 'Cañón Gauss' },
        { ref: 'D3,D8', qty: 2, value: 'COIL LED', desc: 'Diodo emisor de luz (LED) indicador de estado de bobina', cat: 'Interfaz', proyecto: 'Cañón Gauss' },
        { ref: 'D4,D9', qty: 2, value: '31DF4', desc: 'Diodo rectificador de barrera Schottky 30V 3A, DO-201AD', cat: 'Potencia', proyecto: 'Cañón Gauss' },
        { ref: 'D5,D10', qty: 2, value: '75V/5W', desc: 'Diodo Zener de 75V y 5W', cat: 'Potencia', proyecto: 'Cañón Gauss' },
        { ref: 'D6,D11', qty: 2, value: 'IR LED', desc: 'Diodo emisor de luz infrarroja (LED IR)', cat: 'Interfaz', proyecto: 'Cañón Gauss' },
        { ref: 'J1', qty: 1, value: 'TRANSFORMER', desc: 'Terminal de conexión para entrada del transformador', cat: 'Conectores', proyecto: 'Cañón Gauss' },
        { ref: 'J2', qty: 1, value: 'OUTPUT', desc: 'Terminal de conexión para salida general', cat: 'Conectores', proyecto: 'Cañón Gauss' },
        { ref: 'J3', qty: 1, value: 'BOARD INPUT 36V', desc: 'Terminal de entrada de alimentación de la placa (36V)', cat: 'Conectores', proyecto: 'Cañón Gauss' },
        { ref: 'J4', qty: 1, value: 'BOARD INPUT 12V', desc: 'Terminal de entrada de alimentación de la placa (12V)', cat: 'Conectores', proyecto: 'Cañón Gauss' },
        { ref: 'L1,L2', qty: 2, value: 'COIL', desc: 'Bobina magnética', cat: 'Pasivos', proyecto: 'Cañón Gauss' },
        { ref: 'Q1,Q6', qty: 2, value: 'BPW40', desc: 'Fototransistor NPN (Receptor óptico)', cat: 'Semiconductores', proyecto: 'Cañón Gauss' },
        { ref: 'Q2,Q7', qty: 2, value: '2N2222', desc: 'Transistor NPN (Emisor/Base/Colector)', cat: 'Semiconductores', proyecto: 'Cañón Gauss' },
        { ref: 'Q3-Q5,Q8-Q10', qty: 6, value: 'IRF740', desc: 'Transistor MOSFET de potencia Canal N, 10A Id, 400V Vds, 500mOhm Rds, TO-220AB', cat: 'Potencia', proyecto: 'Cañón Gauss' },
        { ref: 'R1,R2,R11,R12', qty: 4, value: '1.2KΩ', desc: 'Resistencia', cat: 'Pasivos', proyecto: 'Cañón Gauss' },
        { ref: 'R3,R6,R13,R16', qty: 4, value: '10KΩ', desc: 'Resistencia', cat: 'Pasivos', proyecto: 'Cañón Gauss' },
        { ref: 'R4,R5,R14,R15', qty: 4, value: '2.2KΩ', desc: 'Resistencia', cat: 'Pasivos', proyecto: 'Cañón Gauss' },
        { ref: 'R7,R17', qty: 2, value: '4.7KΩ', desc: 'Resistencia', cat: 'Pasivos', proyecto: 'Cañón Gauss' },
        { ref: 'R8-R10,R18-R20', qty: 6, value: '10Ω', desc: 'Resistencia', cat: 'Pasivos', proyecto: 'Cañón Gauss' },
        { ref: 'TP1-TP4', qty: 4, value: 'TestPoint', desc: 'Punto de prueba (Test point) para medición en placa', cat: 'Interfaz', proyecto: 'Cañón Gauss' },

        // --- Placa de control ---
        { ref: 'C7,C10', qty: 2, value: '100nF', desc: 'Capacitor no polarizado', cat: 'Pasivos', proyecto: 'Placa de control' },
        { ref: 'C8', qty: 1, value: '10nF', desc: 'Capacitor no polarizado', cat: 'Pasivos', proyecto: 'Placa de control' },
        { ref: 'C9', qty: 1, value: '68nF', desc: 'Capacitor no polarizado', cat: 'Pasivos', proyecto: 'Placa de control' },
        { ref: 'D12-D51', qty: 40, value: 'LED', desc: 'Diodo emisor de luz (LED)', cat: 'Interfaz', proyecto: 'Placa de control' },
        { ref: 'D52,D53', qty: 2, value: '1N4148', desc: 'Diodo estándar de conmutación 100V 0.15A, DO-35', cat: 'Potencia', proyecto: 'Placa de control' },
        { ref: 'J5', qty: 1, value: '12V POWER SUPPLY', desc: 'Terminal de conexión para fuente de alimentación de 12V', cat: 'Conectores', proyecto: 'Placa de control' },
        { ref: 'J6', qty: 1, value: 'PWM OUTPUT', desc: 'Terminal de conexión para salida de señal PWM', cat: 'Conectores', proyecto: 'Placa de control' },
        { ref: 'Q11', qty: 1, value: 'IRF540N', desc: 'Transistor MOSFET HEXFET Canal N, 33A Id, 100V Vds, TO-220', cat: 'Potencia', proyecto: 'Placa de control' },
        { ref: 'R21', qty: 1, value: '6.8KΩ', desc: 'Resistencia', cat: 'Pasivos', proyecto: 'Placa de control' },
        { ref: 'R22,R64', qty: 2, value: '100KΩ', desc: 'Potenciómetro', cat: 'Pasivos', proyecto: 'Placa de control' },
        { ref: 'R23-R63', qty: 41, value: '1KΩ', desc: 'Resistencia', cat: 'Pasivos', proyecto: 'Placa de control' },
        { ref: 'R65', qty: 1, value: '100Ω', desc: 'Resistencia', cat: 'Pasivos', proyecto: 'Placa de control' },
        { ref: 'U1,U7', qty: 2, value: 'NE555P', desc: 'Temporizador de precisión, compatible con 555, PDIP-8', cat: 'Semiconductores', proyecto: 'Placa de control' },
        { ref: 'U2-U6', qty: 5, value: 'CD4017', desc: 'Circuito integrado Contador Johnson (10 salidas)', cat: 'Semiconductores', proyecto: 'Placa de control' }
      ];

      BOM_DATA_RAW.sort((a, b) => a.ref.localeCompare(b.ref, 'es'));

      const PROJECTS   = ['Todos', 'Cañón Gauss', 'Placa de control'];
      const CATEGORIES = ['Todos', ...new Set(BOM_DATA_RAW.map(r => r.cat))];

      // ────────────────────────────────────────────────────────────
      // Estado
      // ────────────────────────────────────────────────────────────
      let activeProject  = 'Todos';
      let activeCategory = 'Todos';

      // Cacheo de referencias
      const el = {
        projectFilter: document.getElementById('bom-project-filter'),
        categoryFilter: document.getElementById('bom-filter-bar'),
        thead: document.getElementById('bom-thead'),
        tbody: document.getElementById('bom-tbody'),
        lines: document.getElementById('bom-lines'),
        units: document.getElementById('bom-units'),
        filterDesc: document.getElementById('bom-filter-desc')
      };

      // Cacheo de filas (data index → <tr>) para filtrar sin tocar DOM.
      // Refleja el orden de BOM_DATA_RAW porque renderTable() usa el mismo orden.
      let rowRefs = [];

      // ────────────────────────────────────────────────────────────
      // Helpers
      // ────────────────────────────────────────────────────────────
      function esc(s) {
        return String(s).replace(/[&<>"']/g, c => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[c]);
      }

      // ────────────────────────────────────────────────────────────
      // Chips: se construyen UNA vez y solo se togglea la clase .on
      // ────────────────────────────────────────────────────────────
      const ICON_CANNON = `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="10" y="15" width="4" height="1.5" rx="0.5" fill="currentColor" opacity="0.5"/><rect x="3" y="10.5" width="17" height="3" rx="0.75" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="7.5" y="9.5" width="1.8" height="5" rx="0.4" fill="currentColor"/><rect x="11.1" y="9.5" width="1.8" height="5" rx="0.4" fill="currentColor"/><rect x="14.7" y="9.5" width="1.8" height="5" rx="0.4" fill="currentColor"/><rect x="1.5" y="10" width="2" height="4" rx="0.5" fill="currentColor"/><rect x="20.5" y="10.5" width="2" height="3" rx="0.5" fill="currentColor"/></svg>`;
      const ICON_PCB    = `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="4.5" cy="6.5" r="0.8" fill="currentColor" opacity="0.5"/><circle cx="19.5" cy="6.5" r="0.8" fill="currentColor" opacity="0.5"/><circle cx="4.5" cy="17.5" r="0.8" fill="currentColor" opacity="0.5"/><circle cx="19.5" cy="17.5" r="0.8" fill="currentColor" opacity="0.5"/><rect x="9" y="9" width="6" height="6" rx="0.5" fill="none" stroke="currentColor" stroke-width="1.2"/><line x1="9" y1="10.5" x2="7" y2="10.5" stroke="currentColor" stroke-width="1"/><line x1="9" y1="12" x2="7" y2="12" stroke="currentColor" stroke-width="1"/><line x1="9" y1="13.5" x2="7" y2="13.5" stroke="currentColor" stroke-width="1"/><line x1="15" y1="10.5" x2="17" y2="10.5" stroke="currentColor" stroke-width="1"/><line x1="15" y1="12" x2="17" y2="12" stroke="currentColor" stroke-width="1"/><line x1="15" y1="13.5" x2="17" y2="13.5" stroke="currentColor" stroke-width="1"/></svg>`;

      const CATEGORY_ICONS = {
        Potencia:        `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>`,
        Almacenamiento:  `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="1" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M8 8V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v3" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>`,
        Pasivos:         `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5" width="10" height="14" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M12 5v14" stroke="currentColor" stroke-width="1.5"/></svg>`,
        Semiconductores: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="currentColor"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>`,
        Interfaz:        `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M8 8h8M8 12h8M8 16h4" stroke="currentColor" stroke-width="1.5"/></svg>`,
        Conectores:      `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M7 7l4 4M17 7l-4 4M7 17l4-4M17 17l-4-4" stroke="currentColor" stroke-width="1.5"/></svg>`
      };

      function projectIcon(p) {
        if (p === 'Cañón Gauss') return ICON_CANNON;
        if (p === 'Placa de control') return ICON_PCB;
        return '';
      }

      function buildProjectChips() {
        el.projectFilter.innerHTML = PROJECTS.map(p =>
          `<button type="button" class="bom-project-chip" data-project="${esc(p)}">${projectIcon(p)}${esc(p)}</button>`
        ).join('');
      }

      function buildCategoryChips() {
        el.categoryFilter.innerHTML = CATEGORIES.map(c =>
          `<button type="button" class="bom-filter-chip" data-category="${esc(c)}">${CATEGORY_ICONS[c] || ''}${esc(c)}</button>`
        ).join('');
      }

      function updateChipStates() {
        el.projectFilter.querySelectorAll('.bom-project-chip').forEach(btn => {
          btn.classList.toggle('on', btn.dataset.project === activeProject);
        });
        el.categoryFilter.querySelectorAll('.bom-filter-chip').forEach(btn => {
          btn.classList.toggle('on', btn.dataset.category === activeCategory);
        });
      }

      // ────────────────────────────────────────────────────────────
      // Filtros: un solo pase sobre los datos, un solo pase sobre las filas.
      // ────────────────────────────────────────────────────────────
      function applyFilters() {
        const filtered = BOM_DATA_RAW.filter(r =>
          (activeProject  === 'Todos' || r.proyecto === activeProject) &&
          (activeCategory === 'Todos' || r.cat      === activeCategory)
        );

        // Actualizar visibilidad usando el cache de filas (sin querySelectorAll)
        const visible = new Set(filtered.map(r => r.ref));
        for (let i = 0; i < rowRefs.length; i++) {
          rowRefs[i].style.display = visible.has(BOM_DATA_RAW[i].ref) ? '' : 'none';
        }

        // Stats
        const totalQty = filtered.reduce((s, r) => s + (Number(r.qty) || 0), 0);
        el.lines.textContent = filtered.length;
        el.units.textContent = totalQty;

        // Filtro activo (sin el bug "P: X Todos")
        const parts = [];
        if (activeProject  !== 'Todos') parts.push('P: ' + activeProject);
        if (activeCategory !== 'Todos') parts.push('C: ' + activeCategory);
        el.filterDesc.textContent = parts.length ? parts.join(' · ') : 'Todos';
      }

      // ────────────────────────────────────────────────────────────
      // Tabla: construir una vez, cachear filas
      // ────────────────────────────────────────────────────────────
      function renderTable() {
        el.thead.innerHTML = `
          <tr>
            <th scope="col">Referencia</th>
            <th scope="col">Cant.</th>
            <th scope="col">Valor / Componente</th>
            <th scope="col">Descripción</th>
            <th scope="col">Clasificación y Proyecto</th>
          </tr>
        `;

        // Limpieza defensiva por si se llama dos veces
        el.tbody.innerHTML = '';
        rowRefs = [];

        const frag = document.createDocumentFragment();
        BOM_DATA_RAW.forEach(r => {
          const tr = document.createElement('tr');
          tr.dataset.cat = r.cat;
          tr.dataset.proyecto = r.proyecto;
          tr.innerHTML = `
            <td data-label="Referencia" style="font-family:'Black Ops One',serif;font-size:.78rem;color:var(--teal)">${esc(r.ref)}</td>
            <td data-label="Cant."><span class="bom-badge ok">${esc(String(r.qty))}</span></td>
            <td data-label="Valor" style="color:#fff;font-weight:600">${esc(r.value)}</td>
            <td data-label="Descripción">${esc(r.desc || '')}</td>
            <td data-label="Clasificación">
              <span class="bom-badge warn" style="font-size:.58rem;margin-bottom:4px;display:inline-block;">${esc(r.cat)}</span>
              <span class="bom-badge ok" style="font-size:.58rem;display:inline-block;">${esc(r.proyecto)}</span>
            </td>
          `;
          frag.appendChild(tr);
          rowRefs.push(tr);
        });
        el.tbody.appendChild(frag);
      }

      // ────────────────────────────────────────────────────────────
      // Event delegation: un listener por contenedor, no por chip
      // ────────────────────────────────────────────────────────────
      el.projectFilter.addEventListener('click', e => {
        const btn = e.target.closest('.bom-project-chip');
        if (!btn || btn.dataset.project === activeProject) return;
        activeProject = btn.dataset.project;
        updateChipStates();
        applyFilters();
      });

      el.categoryFilter.addEventListener('click', e => {
        const btn = e.target.closest('.bom-filter-chip');
        if (!btn || btn.dataset.category === activeCategory) return;
        activeCategory = btn.dataset.category;
        updateChipStates();
        applyFilters();
      });

      // ────────────────────────────────────────────────────────────
      // Init
      // ────────────────────────────────────────────────────────────
      function init() {
        renderTable();
        buildProjectChips();
        buildCategoryChips();
        updateChipStates();
        applyFilters();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init, { once: true });
      } else {
        init();
      }

    })();
  </script>

</body>
</html>
