    // --- Soporte de Gestos para Pantallas Táctiles (Móviles/Tablets) ---

// Nuevas variables para el cálculo del zoom táctil
let initialPinchDistance = null;
let initialScale = 1;

// Función matemática para calcular la distancia entre dos dedos
function getDistance(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

pz.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    // Un dedo: Arrastrar (Pan)
    isDrag = true;
    touchStartX = e.touches[0].clientX - pX;
    touchStartY = e.touches[0].clientY - pY;
  } else if (e.touches.length === 2) {
    // Dos dedos: Preparar Zoom
    isDrag = false; // Desactivar arrastre mientras se hace zoom
    initialPinchDistance = getDistance(e.touches);
    initialScale = scale;
  }
});

// Nota: se requiere { passive: false } para poder usar e.preventDefault()
pz.addEventListener('touchmove', (e) => {
  // Previene el scroll nativo de la pantalla de fondo al interactuar con el plano
  e.preventDefault(); 

  if (e.touches.length === 1 && isDrag) {
    // Lógica de arrastre
    pX = e.touches[0].clientX - touchStartX;
    pY = e.touches[0].clientY - touchStartY;
    updateTrsf(false);
    
    // Resincronización para evitar saltos
    touchStartX = e.touches[0].clientX - pX;
    touchStartY = e.touches[0].clientY - pY;

  } else if (e.touches.length === 2 && initialPinchDistance) {
    // Lógica de zoom táctil
    const currentDistance = getDistance(e.touches);
    const distanceRatio = currentDistance / initialPinchDistance;
    
    // Multiplicamos la escala inicial del pellizco por la proporción del movimiento
    let newScale = initialScale * distanceRatio;
    
    // Respetamos los mismos límites que los botones del HUD
    scale = Math.max(minScale, Math.min(newScale, minScale * 8));
    
    updateTrsf(false);
  }
}, { passive: false });

pz.addEventListener('touchend', (e) => {
  isDrag = false;
  initialPinchDistance = null;
  
  // Si el usuario levanta un dedo pero deja el otro, reiniciamos el origen del arrastre
  if (e.touches.length === 1) {
    isDrag = true;
    touchStartX = e.touches[0].clientX - pX;
    touchStartY = e.touches[0].clientY - pY;
  }
});

      BOM_DATA_RAW.sort((a, b) => a.ref.localeCompare(b.ref));

      let activeProject = 'Todos';
      let activeCategory = 'Todos';

      function escHtml(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function applyFilters() {
        const rows = document.querySelectorAll('#bom-tbody tr');
        rows.forEach(tr => {
          const proyecto = tr.dataset.proyecto;
          const cat = tr.dataset.cat;
          let show = true;
          if (activeProject !== 'Todos' && proyecto !== activeProject) show = false;
          if (activeCategory !== 'Todos' && cat !== activeCategory) show = false;
          tr.style.display = show ? '' : 'none';
        });

        const filteredData = BOM_DATA_RAW.filter(r => {
          if (activeProject !== 'Todos' && r.proyecto !== activeProject) return false;
          if (activeCategory !== 'Todos' && r.cat !== activeCategory) return false;
          return true;
        });
        const totalQty = filteredData.reduce((s, r) => s + parseInt(r.qty || 0, 10), 0);

        const summary = document.getElementById('bom-summary');
        summary.innerHTML = `
          <div class="bom-stat"><div class="bs-l">Líneas</div><div class="bs-v">${filteredData.length}</div></div>
          <div class="bom-stat"><div class="bs-l">Unidades</div><div class="bs-v">${totalQty}</div></div>
          <div class="bom-stat"><div class="bs-l">Filtro Activo</div><div class="bs-v" style="font-size:0.75rem; font-family:'Rajdhani'; font-weight:700; text-transform:uppercase;">${activeProject !== 'Todos' ? 'P: ' + activeProject : ''} ${activeCategory !== 'Todos' ? ' | C: ' + activeCategory : 'Todos'}</div></div>
        `;

        BOM_DATA_RAW.forEach(r => {

          tr.dataset.proyecto = r.proyecto;

            <td data-label="Valor" style="color:#fff;font-weight:600">${escHtml(r.value)}</td>

            <td data-label="Clasificación">

              <span class="bom-badge ok" style="font-size:.58rem; display: inline-block;">${escHtml(r.proyecto)}</span>
            </td>
          `;
          fragment.appendChild(tr);
        });
        tbody.appendChild(fragment);
      }

      function init() {
        renderTable();
        buildProjectChips();
        buildCategoryChips();
        applyFilters();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
