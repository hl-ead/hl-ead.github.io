    const seen = new Set();

    // ═══════════════════════════════════════════════════════════════
    // 3D SCENE
    // ═══════════════════════════════════════════════════════════════
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    camera.position.set(0, 0, 1.5);
    scene.add(new THREE.Ambientlight(0xffffff, 1.2));

    const pt1 = new THREE.PointLight(0xff00ff, 2, 100);
    pt1.position.set(5, 10, 5);
    scene.add(pt1);

    const pt2 = new THREE.PointLight(0x00ffff, 1.3, 100);
    pt2.position.set(-5, -10, 5);
    scene.add(pt2);

    // ═══════════════════════════════════════════════════════════════
    // MODEL LOADING
    // ═══════════════════════════════════════════════════════════════
    const loader = new THREE.GLTFLoader();
    const dracoLoader = new THREE.DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.1/');
    loader.setDRACOLoader(dracoLoader);

    let model;
    const clickables = [];
    let selectedId = null;

    loader.load('gauss_cannon_low.glb', (gltf) => {
      model = gltf.scene;
      scene.add(model);
      model.scale.set(1,1,1);

      model.traverse(child => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          const id = child.name;
          if (PARTS[id]) {
            clickables.push({
              id,
              mesh: child,
              origCol: child.material.color.getHex(),
              origEmi: child.material.emissive.getHex()
            });
            child.addEventListener('click', () => openPanel(id));
          }
        }
      });
    });

    // ═══════════════════════════════════════════════════════════════
    // RAYCASTING & INTERACTION
    // ═══════════════════════════════════════════════════════════════
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    const ZOOM_MIN = 0.6, ZOOM_MAX = 4;

    let drag = false, touchDrag = false;
    let dragStartX = 0, dragStartY = 0;
    let touchStartDist = 0;

    renderer.domElement.addEventListener('mousedown', e => {
      drag = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
    });

    renderer.domElement.addEventListener('mousemove', e => {
      mouse.x = (e.clientX / innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / innerHeight) * 2 + 1;

      if (drag) {
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        model.rotation.y -= dx * 0.008;
        model.rotation.x -= dy * 0.008;
      }
    });

    renderer.domElement.addEventListener('mouseup', e => {
      if (!drag || (Math.abs(e.clientX-dragStartX) < 5 && Math.abs(e.clientY-dragStartY) < 5)) {
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(scene.children, true);
        if (intersects.length > 0) {
          const obj = intersects[0].object;
          const id = obj.name;
          if (PARTS[id]) {
            openPanel(id);
          }
        }
      }
      drag = false;
    });

    renderer.domElement.addEventListener('wheel', e => {
      e.preventDefault();
      const delta = e.deltaY;
      const factor = delta > 0 ? 1.1 : 0.9;
      const dist = camera.position.length();
      const newDist = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, dist * factor));
      camera.position.normalize().multiplyScalar(newDist);
    }, { passive: false });

    renderer.domElement.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        touchDrag = true;
        dragStartX = e.touches[0].clientX;
        dragStartY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        touchDrag = false;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        touchStartDist = Math.sqrt(dx*dx + dy*dy);
      }
    });

    renderer.domElement.addEventListener('touchmove', e => {
      if (e.touches.length === 1 && touchDrag) {
        const dx = e.touches[0].clientX - dragStartX;
        const dy = e.touches[0].clientY - dragStartY;
        model.rotation.y -= dx * 0.008;
        model.rotation.x -= dy * 0.008;
        dragStartX = e.touches[0].clientX;
        dragStartY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const factor = dist / touchStartDist;
        const camDist = camera.position.length();
        const newDist = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, camDist / factor));
        camera.position.normalize().multiplyScalar(newDist);
        touchStartDist = dist;
      }
    });

    // ═══════════════════════════════════════════════════════════════
    // PANEL FUNCTIONS
    // ═══════════════════════════════════════════════════════════════
    function openPanel(id) {
      selectedId = id;
      const part = PARTS[id];
      if (!part) return;

      seen.add(id);
      updateCounter();

      document.getElementById('p-cat').textContent = part.cat;
      document.getElementById('p-name').textContent = part.name;
      document.getElementById('p-id').textContent = part.id;
      document.getElementById('p-desc').textContent = part.desc;

      const statsHtml = part.stats.map(s => 
        `<div class="sbox"><div class="slab">${s.l}</div><div class="sval">${s.v}</div></div>`
      ).join('');
      document.getElementById('p-stats').innerHTML = statsHtml;

      const schThumb = document.getElementById('sch-sec');
      if (part.sch) {
        document.getElementById('sch-img').src = part.sch;
        schThumb.style.display = 'block';
      } else {
        schThumb.style.display = 'none';
      }

      // Highlight
      clickables.forEach(c => {
        if (c.id === id) {
          c.mesh.material.color.setHex(0x00d9b0);
          c.mesh.material.emissive.setHex(0x00d9b0);
          c.mesh.material.emissiveIntensity = 0.6;
        } else {
          c.mesh.material.color.setHex(c.origCol);
          c.mesh.material.emissive.setHex(c.origEmi);
          c.mesh.material.emissiveIntensity = 0;
        }
      });

      const panel = document.getElementById('panel');
      panel.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    window.openPanel = openPanel;

    function closePanel() {
      selectedId = null;
      const panel = document.getElementById('panel');
      panel.classList.remove('open');
      document.body.style.overflow = 'auto';

      clickables.forEach(c => {
        c.mesh.material.color.setHex(c.origCol);
        c.mesh.material.emissive.setHex(c.origEmi);
        c.mesh.material.emissiveIntensity = 0;
      });
    }
    window.closePanel = closePanel;

    // ═══════════════════════════════════════════════════════════════
    // PANORAMIC ZOOM VIEWER (PZ)
    // ═══════════════════════════════════════════════════════════════
    let pzVbX = 0, pzVbY = 0, pzVbW = 1, pzVbH = 1;
    let pzOrigW = 0, pzOrigH = 0;
    const PZ_ZOOM_F = 0.15;

    window.openPZ = function(src) {
      document.getElementById('pz-viewer').classList.add('open');
      const img = new Image();
      img.onload = function() {
        pzOrigW = img.width;
        pzOrigH = img.height;
        pzVbX = 0; pzVbY = 0; pzVbW = 1; pzVbH = 1;
        pzApplyVB();
        const content = document.getElementById('pz-content');
        content.innerHTML = '';
        content.appendChild(img);
      };
      img.src = src;
    };

    window.closePZ = function() {
      document.getElementById('pz-viewer').classList.remove('open');
    };

    function pzApplyVB() {
      const content = document.getElementById('pz-content');
      if (content.querySelector('img')) {
        const img = content.querySelector('img');
        const stage = document.getElementById('pz-stage');
        const r = stage.getBoundingClientRect();
        const sw = r.width, sh = r.height;
        const scale = Math.min(sw/pzVbW, sh/pzVbH);
        img.style.width = (pzVbW * scale) + 'px';
        img.style.height = (pzVbH * scale) + 'px';
        img.style.transform = `translate(${-pzVbX*scale}px, ${-pzVbY*scale}px)`;
      }
      const zval = document.getElementById('pz-zoom-val');
      if (zval) zval.textContent = Math.round((1/pzVbW)*100) + '%';
    }

    window.pzFit = function() {
      pzVbX = 0; pzVbY = 0; pzVbW = 1; pzVbH = 1;
      pzApplyVB();
    };

    function pzZoomAt(factor, cx, cy) {
      const stage = document.getElementById('pz-stage');
      const r = stage.getBoundingClientRect();
      const rx = (cx - r.left) / r.width;
      const ry = (cy - r.top) / r.height;
      const pivotX = pzVbX + rx * pzVbW;
      const pivotY = pzVbY + ry * pzVbH;
      const minW = pzOrigW / 10,  minH = pzOrigH / 10;
      const maxW = pzOrigW * 1, maxH = pzOrigH * 1;
      let nw = Math.max(minW, Math.min(maxW, pzVbW / factor));
      let nh = nw * (pzOrigH / pzOrigW);
      pzVbX = pivotX - rx * nw;
      pzVbY = pivotY - ry * nh;
      pzVbW = nw; pzVbH = nh;
      pzApplyVB();
    }

    function pzZoomBtn(f) {
      const stage = document.getElementById('pz-stage');
      const r = stage.getBoundingClientRect();
      pzZoomAt(f, r.left + r.width/2, r.top + r.height/2);
    }
    window.pzZoomBtn = pzZoomBtn;

    const pzStage = document.getElementById('pz-stage');
    let pzDrag = false, pzDSX = 0, pzDSY = 0, pzDVBX = 0, pzDVBY = 0;
    pzStage.addEventListener('wheel', e => {
      e.preventDefault(); e.stopPropagation();
      pzZoomAt(e.deltaY < 0 ? 1+PZ_ZOOM_F : 1-PZ_ZOOM_F, e.clientX, e.clientY);
    },{passive:false});

    pzStage.addEventListener('mousedown', e => {
      if(e.button!==0) return;
      e.preventDefault();
      pzDrag=true; pzDSX=e.clientX; pzDSY=e.clientY; pzDVBX=pzVbX; pzDVBY=pzVbY;
      pzStage.classList.add('dragging');
    });

    window.addEventListener('mousemove', e => {
      if(!pzDrag) return;
      const stage = document.getElementById('pz-stage');
      const rect  = stage.getBoundingClientRect();
      pzVbX = pzDVBX - (e.clientX-pzDSX) * (pzVbW/rect.width);
      pzVbY = pzDVBY - (e.clientY-pzDSY) * (pzVbH/rect.height);
      pzApplyVB();
    });

    window.addEventListener('mouseup', () => { pzDrag=false; pzStage.classList.remove('dragging'); });
    pzStage.addEventListener('dblclick', pzFit);

    let pzLastTap = 0, pzTDrag = false, pzTSX = 0, pzTSY = 0, pzTVBX = 0, pzTVBY = 0;
    let pzPD0 = 0, pzPVBX0 = 0, pzPVBY0 = 0, pzPVBW0 = 0, pzPVBH0 = 0;

    pzStage.addEventListener('touchstart', e => {
      e.preventDefault();
      if(e.touches.length === 1){
        pzTDrag=true; pzTSX=e.touches[0].clientX; pzTSY=e.touches[0].clientY;
        pzTVBX=pzVbX; pzTVBY=pzVbY;
        const now=Date.now(); if(now-pzLastTap<300) pzFit(); pzLastTap=now;
      } else if(e.touches.length === 2){
        pzTDrag=false;
        pzPD0 = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
        pzPVBX0=pzVbX; pzPVBY0=pzVbY; pzPVBW0=pzVbW; pzPVBH0=pzVbH;
      }
    },{passive:false});

    pzStage.addEventListener('touchmove', e => {
      e.preventDefault();
      if(e.touches.length===1 && pzTDrag){
        const stage=document.getElementById('pz-stage'), rect=stage.getBoundingClientRect();
        pzVbX = pzTVBX - (e.touches[0].clientX-pzTSX)*(pzVbW/rect.width);
        pzVbY = pzTVBY - (e.touches[0].clientY-pzTSY)*(pzVbH/rect.height);
        pzApplyVB();
      } else if(e.touches.length===2 && pzPD0){
        const nd = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
        const f  = nd/pzPD0;
        const mx = (e.touches[0].clientX+e.touches[1].clientX)/2;
        const my = (e.touches[0].clientY+e.touches[1].clientY)/2;
        const stage=document.getElementById('pz-stage'), rect=stage.getBoundingClientRect();
        const rx=(mx-rect.left)/rect.width, ry=(my-rect.top)/rect.height;
        let nw = pzPVBW0/f, nh = pzPVBH0/f;
        if(pzOrigW > 0){
          const minW=pzOrigW/10, maxW=pzOrigW*0.9;
          const minH=pzOrigH/10, maxH=pzOrigH*0.9;
          if(nw < minW){ nw=minW; nh=minH; }
          if(nw > maxW){ nw=maxW; nh=maxH; }
        }
        const pivX = pzPVBX0+rx*pzPVBW0, pivY = pzPVBY0+ry*pzPVBH0;
        pzVbX=pivX-rx*nw; pzVbY=pivY-ry*nh; pzVbW=nw; pzVbH=nh;
        pzApplyVB();
      }
    },{passive:false});

    pzStage.addEventListener('touchend', e => {
      if(e.touches.length===0){ pzTDrag=false; }
      if(e.touches.length<2){ pzPD0=0; }
    });

    // ═══════════════════════════════════════════════════════════════
    // COUNTER
    // ═══════════════════════════════════════════════════════════════
    function updateCounter() {
      const total = 10; 
      const count = seen ? seen.size : 0;
      const percent = (count / total) * 100;
      const circle = document.getElementById('progress-circle');
      if (circle) {
        const circumference = 2 * Math.PI * 16;
        const dash = (percent / 100) * circumference;
        circle.style.strokeDasharray = `${dash} ${circumference}`;
      }
      const txt = document.getElementById('counter-text');
      if (txt) txt.textContent = `${count}/${total}`;
    }

    // ═══════════════════════════════════════════════════════════════
    // HINT
    // ═══════════════════════════════════════════════════════════════
    let hintHidden = false;
    function hideHintOnInteraction() {
      if (!hintHidden) {
        document.getElementById('hint').style.opacity = '0';
        hintHidden = true;
      }
    }
    renderer.domElement.addEventListener('mousedown', hideHintOnInteraction);
    renderer.domElement.addEventListener('touchstart', hideHintOnInteraction);
    renderer.domElement.addEventListener('wheel', hideHintOnInteraction);

    window.addEventListener('keydown', e => {
      if(e.key==='Escape'){
        closePanel(); closePZ(); 
      }
    });

    document.getElementById('panel').addEventListener('wheel', (e) => e.stopPropagation(), { passive: false });
    document.getElementById('pz-viewer').addEventListener('wheel', (e) => e.stopPropagation(), { passive: false });

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });

    // ═══════════════════════════════════════════════════════════════
    // PANEL SWIPE DOWN TO CLOSE
    // ═══════════════════════════════════════════════════════════════
    let panelTouchStartY = 0;
    let panelStartScrollTop = 0;

    document.addEventListener('DOMContentLoaded', () => {
      const piElement = document.querySelector('.pi');
      if (piElement) {
        piElement.addEventListener('touchstart', (e) => {
          panelTouchStartY = e.touches[0].clientY;
          panelStartScrollTop = piElement.scrollTop;
        }, { passive: true });

        piElement.addEventListener('touchmove', (e) => {
          const touchCurrentY = e.touches[0].clientY;
          const touchDelta = touchCurrentY - panelTouchStartY;
          
          if (panelStartScrollTop === 0 && touchDelta > 60) {
            closePanel();
            e.preventDefault();
          }
        }, { passive: false });
      }
    });
    // ═══════════════════════════════════════════════════════════════
    // ANIMATION LOOP
    // ═══════════════════════════════════════════════════════════════
    const clock = new THREE.Clock();
    let autoRot = true;
    const MODEL_COLLIDE = ZOOM_MIN;

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      if(!drag && !touchDrag) {
        model.rotation.y += .0012;
      }

      const camDist = camera.position.length();
      if(camDist < MODEL_COLLIDE) {
        camera.position.normalize().multiplyScalar(MODEL_COLLIDE);
      }

      if(selectedId === 'coil1' || selectedId === 'coil2') {
        const p = (.5+.5*Math.sin(t*8))*.4;
        clickables.filter(c=>c.id===selectedId).forEach(c=>{
          if(c.mesh.material.emissiveIntensity!==undefined)
            c.mesh.material.emissiveIntensity = p;
        });
      }

      pt1.intensity = .9 + .1*Math.sin(t*1.7);
      pt2.intensity = .5 + .08*Math.sin(t*2.3+1);

      renderer.render(scene,camera);
    }
    animate();

    // Inicializar contador
    updateCounter();
</script>
</body>
</html>
