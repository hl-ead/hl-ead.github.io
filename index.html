<!DOCTYPE html>

</head>

        Esquemas

  <!-- ============================================================
       NAVEGACIÓN MÓVIL INFERIOR (enlaces)

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Home</span>
      </a>
      <a href="esquemas.html" class="mnbtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
        <span>Esquemas</span>
      </a>
      <a href="bom.html" class="mnbtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>

  <!-- ============================================================
       HINT Y CONTADOR
       ============================================================ -->
  <div id="hint">
    <div id="hint-inner">
      <div class="hdot"></div>
      Toca un componente para inspeccionarlo · Arrastra para rotar · Pellizca para zoom
      <div class="hdot" style="animation-delay:.7s"></div>
    </div>
  </div>

  <div id="counter">
    <svg viewBox="0 0 40 40" class="circular-chart">
      <circle class="circle-bg" cx="20" cy="20" r="16" />
      <circle class="circle" cx="20" cy="20" r="16" stroke-dasharray="0, 100" id="progress-circle" />
    </svg>
    <span id="counter-text">0/10</span>
  </div>

  <!-- ============================================================
       TOOLTIP
       ============================================================ -->
  <div id="tip"></div>

  <!-- ============================================================
       PANEL DE INFORMACIÓN
       ============================================================ -->
  <div id="panel">
    <div class="drag-bar"></div>
    <button id="close-panel" onclick="closePanel()">✕</button>
    <div class="pi">
      <div class="p-cat" id="p-cat">Componente</div>
      <div class="p-name" id="p-name">—</div>
      <div class="p-id" id="p-id">—</div>
      <div class="p-div"></div>
      <div class="p-desc" id="p-desc">—</div>
      <div class="p-stats" id="p-stats"></div>
      <div class="sch-sec" id="sch-sec" style="display:none">
        <div class="sch-lbl">Esquemático del módulo</div>
        <div class="sch-thumb" id="sch-thumb">
          <img id="sch-img" src="" alt="Esquemático">
          <div class="sch-zh">🔍 Zoom</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============================================================
       VISOR INDEPENDIENTE (ZOOM DE IMÁGENES)
       ============================================================ -->
  <div id="pz-viewer">
    <div id="pz-topbar">
      <div id="pz-title">Esquemático</div>
      <div id="pz-controls">
        <button class="pz-btn" onclick="pzZoomBtn(1.3)" title="Acercar">+</button>
        <button class="pz-btn" onclick="pzZoomBtn(0.77)" title="Alejar">−</button>
        <button class="pz-btn" onclick="pzFit()" title="Ajustar" style="font-size:.75rem;letter-spacing:.05em;width:auto;padding:0 10px;font-family:'Rajdhani',sans-serif;font-weight:700">FIT</button>
        <button class="pz-btn pz-close-btn" onclick="closePZ()" title="Cerrar">✕</button>
      </div>
    </div>
    <div id="pz-stage">
      <div id="pz-content"></div>
      <div id="pz-zoom-bar">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="opacity:.5;color:var(--teal)"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span id="pz-zoom-val">100%</span>
      </div>
      <div id="pz-hint-bar">Arrastra · Pellizca para zoom · Doble toque para ajustar</div>
    </div>
  </div>

  <!-- ============================================================
       SCRIPTS
       ============================================================ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

  <script>
    // ═══════════════════════════════════════════════════════════════
    // PARTS DATA
    // ═══════════════════════════════════════════════════════════════
    const PARTS = {

  "Tubo_para_Bobinas_Entrada-2": {
    cat: 'Estructura',
    name: 'Tubo de Entrada',
    id: 'MECH-02',
    desc: 'Tubo de alimentación del proyectil. Es el primer tramo que el proyectil recorre antes de ser acelerado por las bobinas. Su diseño asegura un centrado perfecto del proyectil en el eje del cañón.',
    stats: [
      { l: 'Material', v: 'PETG' },
      { l: 'Longitud', v: '250 mm' },
      { l: 'Diámetro interno', v: '23 mm' },
      { l: 'Diámetro externo', v: '26 mm' } 
    ]
  },   

  "Tubo_para_Bobinas_Salida-2": {
    cat: 'Estructura',
    name: 'Tubo de Salida',
    id: 'MECH-03',
    desc: 'Tubo que guía el proyectil después de pasar por las bobinas. Está fabricado en acero inoxidable con un acabado interior pulido para minimizar la fricción y asegurar una trayectoria recta.',
    stats: [
      { l: 'Material', v: 'PETG' },
      { l: 'Longitud', v: '250 mm' },
      { l: 'Diámetro interno', v: '23 mm' },
      { l: 'Diámetro externo', v: '26 mm' } 
    ]
  },

  "Anillo_Final-1": {
    cat: 'Estructura',
    name: 'Anillo Final (Entrada)',
    id: 'STR-02',
    desc: 'Anillo de sujeción ubicado en la parte frontal del cañón. Mantiene fijo el tubo de entrada y proporciona un soporte adicional para el módulo de sensores.',
    stats: [
      { l: 'Material', v: 'PLA' },
      { l: 'Longitud', v: '3 mm' },
      { l: 'Diámetro interno', v: '26.7 mm' },
      { l: 'Diámetro externo', v: '36.7 mm' }   
    ]
  },

  "Anillo_Final-2": {
    cat: 'Estructura',
    name: 'Anillo Final (Salida)',
    id: 'STR-03',
    desc: 'Anillo de sujeción ubicado en el extremo de salida del cañón. Proporciona rigidez estructural y sirve como punto de anclaje para el sistema de fijación del conjunto.',
    stats: [
      { l: 'Material', v: 'PLA' },
      { l: 'Longitud', v: '3 mm' },
      { l: 'Diámetro interno', v: '26.7 mm' },
      { l: 'Diámetro externo', v: '36.7 mm' }
    ]
  },

  "Conector_para_Tubo_Final-1": {
    cat: 'Estructura',
    name: 'Conector',
    id: 'CON-01',
    desc: 'Pieza de conexión que une el tubo de salida con la estructura base. Asegura una transición rígida y estable entre el cañón y el soporte del sistema.',
    stats: [
      { l: 'Material', v: 'PETG' },
      { l: 'Longitud', v: '60 mm' },
      { l: 'Diámetro interno', v: '23 mm' },
      { l: 'Diámetro externo', v: '29 mm' }
    ]
  },

  "Soporte_del_Tubo_Medio-2": {
    cat: 'Estructura',
    name: 'Soporte Central',
    id: 'STR-01',
    desc: 'Soporte intermedio que mantiene alineado el tubo central del cañón. Proporciona rigidez al conjunto y evita vibraciones durante el disparo. Fabricado en aluminio mediante mecanizado CNC.',
    stats: [
      { l: 'Material', v: 'PETG' },
      { l: 'Longitud', v: '10 mm' },
      { l: 'Diámetro interno', v: '29.7 mm' },
      { l: 'Diámetro externo', v: '34.2 mm' }
    ]
  },

  "Modulo_de_Sensores-3": {
    cat: 'Electrónica',
    name: 'Módulo de Sensores para Bobina ',
    id: 'SENS-02',
    desc: 'Módulo que aloja los sensores ópticos infrarrojos (emisor y receptor) para la detección del proyectil. Está posicionado para leer la posición del proyectil antes de la primera etapa de aceleración.',
    stats: [
      { l: 'Material', v: 'PLA' },
      { l: 'Sensor', v: 'IR LED + Fototransistor' },
      { l: 'Titulo', v: 'Valor' },
      { l: 'Titulo', v: 'Valor' }
    ],
    schemImg: 'esquemas/modulo-bobina.svg',
    schemTitle: 'Esquema del Módulo'
  },

  "Modulo_de_Sensores-4": {
    cat: 'Electrónica',
    name: 'Módulo de Sensores para Bobina',
    id: 'SENS-01',
    desc: 'Módulo gemelo al superior, ubicado en la parte inferior del cañón. Trabaja en conjunto con el superior para detectar con precisión el paso del proyectil y sincronizar el disparo de las bobinas.',
    stats: [
      { l: 'Material', v: 'PLA' },
      { l: 'Sensor', v: 'IR LED + Fototransistor' },
      { l: 'Titulo', v: 'Valor' },
      { l: 'Titulo', v: 'Valor' }
    ],
    schemImg: 'esquemas/modulo-bobina.svg',
    schemTitle: 'Esquema del Módulo'
  }
  
    };

    // ═══════════════════════════════════════════════════════════════
    // THREE.JS SETUP
    // ═══════════════════════════════════════════════════════════════
    const renderer = new THREE.WebGLRenderer({antialias:true,alpha:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(renderer.domElement);

    const isMobile = /Mobi|Android/i.test(navigator.userAgent) || window.innerWidth < 768;
    if(isMobile){
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
      renderer.shadowMap.enabled = false;
    }

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 500);

    const ZOOM_MIN = isMobile ? 14 : 10;
    const ZOOM_MAX = isMobile ? 38 : 32;
    const CAM_INIT = isMobile ? 24 : 16;
    camera.position.set(5, 6, CAM_INIT);
    camera.lookAt(0, 1, 0);

    const starG = new THREE.BufferGeometry();
    const spos = new Float32Array(2400);
    for(let i=0;i<2400;i++) spos[i]=(Math.random()-.5)*300;
    starG.setAttribute('position',new THREE.BufferAttribute(spos,3));
    scene.add(new THREE.Points(starG, new THREE.PointsMaterial({color:0xffffff,size:.12,transparent:true,opacity:.6})));

    scene.add(new THREE.AmbientLight(0x1a2240,.7));
    const sun = new THREE.DirectionalLight(0xfff5e8,1.8);
    sun.position.set(12,14,8);sun.castShadow=!isMobile;
    sun.shadow.mapSize.width=isMobile?512:1024;
    sun.shadow.mapSize.height=isMobile?512:1024;
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0x2244ff,.25);
    fill.position.set(-10,-4,-8);scene.add(fill);
    const pt1 = new THREE.PointLight(0xff8c2a,.9,18);
    pt1.position.set(-2,4,2);scene.add(pt1);
    const pt2 = new THREE.PointLight(0x00d9b0,.5,20);
    pt2.position.set(4,3,1);scene.add(pt2);

    // ═══════════════════════════════════════════════════════════════
    // MODEL CONSTRUCTION
    // ═══════════════════════════════════════════════════════════════
    const model = new THREE.Group();
    scene.add(model);
    const clickables = [];

    const _origCreateImageBitmap = window.createImageBitmap;
    window.createImageBitmap = function(source) {
      return _origCreateImageBitmap(source).catch(function() {
        const canvas = document.createElement('canvas');
        canvas.width = 1; canvas.height = 1;
        return _origCreateImageBitmap(canvas);
      });
    };

    const dracoLoader = new THREE.DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    dracoLoader.setDecoderConfig({ type: 'js' });
    dracoLoader.preload();

    const gltfLoader = new THREE.GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    function prepararModelo(root) {
      root.traverse(function(child) {
        if(child.isMesh) {
          const c = child.material.color || new THREE.Color(0xcccccc);
          const r = child.material.roughness !== undefined ? child.material.roughness : 0.5;
          const m = child.material.metalness !== undefined ? child.material.metalness : 0.3;
          child.material = new THREE.MeshStandardMaterial({ color:c, roughness:r, metalness:m });
          child.castShadow = !isMobile;
          child.receiveShadow = !isMobile;
        }
      });
      const box = new THREE.Box3().setFromObject(root);
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(...box.getSize(new THREE.Vector3()).toArray());
      const scale = 12 / maxDim;
      root.scale.setScalar(scale);
      root.position.set(-center.x*scale, -center.y*scale, -center.z*scale);
    }

    function conectarClickables(root) {
      clickables.length = 0;
      root.traverse(function(child) {
        if(child.isMesh && PARTS[child.name]) {
          child.userData.partId = child.name;
          clickables.push({ mesh:child, origMat:child.material, id:child.name });
        }
      });
    }

    let rootLow = null;
    gltfLoader.load(
      'gauss_cannon_low.glb',
      function(gltf) {
        rootLow = gltf.scene;
        prepararModelo(rootLow);
        model.add(rootLow);
        model.rotation.y = 0.3;
        conectarClickables(rootLow);
        console.log('✅ Modelo liviano cargado.');

        gltfLoader.load(
          'gauss_cannon.glb',
          function(gltfHD) {
            const rootHD = gltfHD.scene;
            prepararModelo(rootHD);
            model.remove(rootLow);
            model.add(rootHD);
            conectarClickables(rootHD);
            console.log('✅ Modelo completo cargado. Piezas:', clickables.length);
            if(clickables.length === 0) {
              console.warn('⚠️ Nodos en el modelo:');
              rootHD.traverse(c => { if(c.isMesh) console.log(' -', c.name); });
            }
          },
          null,
          function(err) {
            console.warn('Modelo completo no disponible, usando liviano:', err.message);
          }
        );
      },
      null,
      function(err) {
        console.warn('Modelo liviano no disponible:', err.message);
      }
    );

    // ═══════════════════════════════════════════════════════════════
    // HIGHLIGHT / INTERACTION
    // ═══════════════════════════════════════════════════════════════
    const highlightMat = new THREE.MeshStandardMaterial({
      color:0x00d9b0,roughness:.25,metalness:.5,emissive:0x00d9b0,emissiveIntensity:.35
    });

    let selectedId = null, hoveredId = null;
    const seen = new Set();

    function setHighlight(id, on) {
      clickables.forEach(c => {
        if(c.id === id) {
          if(on){
            const hm = highlightMat.clone();
            hm.color.set(c.id.startsWith('pcb') ? 0x00d9b0 : 0xff8c2a);
            hm.emissive.set(c.id.startsWith('pcb') ? 0x00d9b0 : 0xff8c2a);
            hm.emissiveIntensity = .3;
            c.mesh.material = hm;
          } else {
            c.mesh.material = c.origMat;
          }
        }
      });
    }

    function openPanel(id) {
      if(selectedId && selectedId !== id) setHighlight(selectedId, false);
      selectedId = id;
      setHighlight(id, true);
      seen.add(id);
      updateCounter();
      const d = PARTS[id];
      document.getElementById('p-cat').textContent = d.cat;
      document.getElementById('p-name').textContent = d.name;
      document.getElementById('p-id').textContent = d.id;
      document.getElementById('p-desc').textContent = d.desc;

      const statsEl = document.getElementById('p-stats');
      statsEl.innerHTML = d.stats.map(s=>
        `<div class="sbox"><div class="slbl">${s.l}</div><div class="sval">${s.v}</div></div>`
      ).join('');

      const schSec = document.getElementById('sch-sec');
      const schImg = document.getElementById('sch-img');
      const schThumb = document.getElementById('sch-thumb');
      if(d.schemImg) {
        schSec.style.display = 'block';
        schImg.src = d.schemImg;
        schThumb.onclick = () => openPZ(d.schemImg, d.schemTitle || d.name);
        currentSchemId = d.schemImg;
      } else {
        schSec.style.display = 'none';
        currentSchemId = null;
      }

      document.getElementById('panel').classList.add('open');
      document.getElementById('hint').style.opacity = '0';
    }

    function closePanel() {
      if(selectedId) setHighlight(selectedId, false);
      selectedId = null;
      document.getElementById('panel').classList.remove('open');
    }
    window.closePanel = closePanel;

    // ═══════════════════════════════════════════════════════════════
    // RAYCASTER
    // ═══════════════════════════════════════════════════════════════
    const ray = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const tip = document.getElementById('tip');
    let currentSchemId = null;

    function updateMouse(x, y) {
      mouse.x = (x/innerWidth)*2-1;
      mouse.y = -(y/innerHeight)*2+1;
    }

    function doRaycast() {
      ray.setFromCamera(mouse, camera);
      return ray.intersectObjects(clickables.map(c=>c.mesh));
    }

    let _mouseMoveQueued = false;
    let _lastMouseX = 0, _lastMouseY = 0;
    window.addEventListener('mousemove', e => {
      _lastMouseX = e.clientX; _lastMouseY = e.clientY;
      updateMouse(e.clientX, e.clientY);

      if(!_mouseMoveQueued){
        _mouseMoveQueued = true;
        requestAnimationFrame(() => {
          _mouseMoveQueued = false;
          const hits = doRaycast();
          const hid = hits.length ? hits[0].object.userData.partId : null;

          if(hid !== hoveredId) {
            if(hoveredId && hoveredId !== selectedId) setHighlight(hoveredId, false);
            hoveredId = hid;
            if(hoveredId && hoveredId !== selectedId) setHighlight(hoveredId, true);
            document.body.classList.toggle('hov', !!hoveredId);
          }

          if(hid) {
            const part = PARTS[hid];
            tip.style.left = (_lastMouseX+16)+'px';
            tip.style.top  = (_lastMouseY-8)+'px';
            tip.innerHTML = part ? `${part.name} <small>${part.cat}</small>` : hid;
            tip.style.opacity = '1';
          } else {
            tip.style.opacity = '0';
          }
        });
      }
    });

    window.addEventListener('click', e => {
      if(e.target !== renderer.domElement) return;
      updateMouse(e.clientX, e.clientY);
      const hits = doRaycast();
      if(hits.length) {
        const id = hits[0].object.userData.partId;
        if(id) { id===selectedId ? closePanel() : openPanel(id); }
      } else {
        closePanel();
      }
    });

    // ═══════════════════════════════════════════════════════════════
    // DRAG TO ROTATE
    // ═══════════════════════════════════════════════════════════════
    let drag = false, px = 0, py = 0, dragDist = 0;
    window.addEventListener('mousedown', e => {
      if(e.target!==renderer.domElement) return;
      drag=true; px=e.clientX; py=e.clientY; dragDist=0;
      hideHintOnInteraction();
    });
    window.addEventListener('mouseup', () => drag=false);
    window.addEventListener('mousemove', e => {
      if(!drag) return;
      const dx=e.clientX-px, dy=e.clientY-py;
      dragDist += Math.abs(dx)+Math.abs(dy);
      model.rotation.y += dx*.007;
      model.rotation.x = Math.max(-1,Math.min(.6,model.rotation.x+dy*.004));
      px=e.clientX; py=e.clientY;
    });

    window.addEventListener('wheel', e=>{
      camera.position.multiplyScalar(1+e.deltaY*.001);
      camera.position.clampLength(ZOOM_MIN, ZOOM_MAX);
      hideHintOnInteraction();
    },{passive:true});

    // ═══════════════════════════════════════════════════════════════
    // TOUCH CONTROLS
    // ═══════════════════════════════════════════════════════════════
    let touches = {}, pinchDist = 0, touchDrag = false, touchMoved = false;
    let tpx = 0, tpy = 0, touchTime = 0;

    window.addEventListener('touchstart', e => {
      if (e.target !== renderer.domElement) return;
      e.preventDefault();
      touchMoved = false; touchTime = Date.now();
      if(e.touches.length === 1) {
        tpx = e.touches[0].clientX; tpy = e.touches[0].clientY; touchDrag=true;
      } else if(e.touches.length === 2) {
        pinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
      hideHintOnInteraction();
    },{passive:false});

    window.addEventListener('touchmove', e => {
      if (e.target !== renderer.domElement) return;
      e.preventDefault();
      touchMoved = true;
      if(e.touches.length === 1 && touchDrag) {
        const dx=e.touches[0].clientX-tpx, dy=e.touches[0].clientY-tpy;
        model.rotation.y += dx*.007;
        model.rotation.x = Math.max(-1,Math.min(.6,model.rotation.x+dy*.004));
        tpx=e.touches[0].clientX; tpy=e.touches[0].clientY;
      } else if(e.touches.length === 2) {
        const d = Math.hypot(
          e.touches[0].clientX-e.touches[1].clientX,
          e.touches[0].clientY-e.touches[1].clientY
        );
        camera.position.multiplyScalar(pinchDist/d);
        camera.position.clampLength(ZOOM_MIN, ZOOM_MAX);
        pinchDist=d;
      }
    },{passive:false});

    window.addEventListener('touchend', e => {
      if (e.target !== renderer.domElement) { touchDrag=false; return; }
      touchDrag=false;
      if(!touchMoved && Date.now()-touchTime < 300 && e.changedTouches.length===1) {
        const t = e.changedTouches[0];
        updateMouse(t.clientX, t.clientY);
        const hits = doRaycast();
        if(hits.length){
          const id=hits[0].object.userData.partId;
          if(id){ id===selectedId?closePanel():openPanel(id); }
        } else {
          closePanel();
        }
      }
    });

    // ═══════════════════════════════════════════════════════════════
    // PAN-ZOOM VIEWER (original con viewBox)
    // ═══════════════════════════════════════════════════════════════
    let pzSvgW = 0, pzSvgH = 0;
    async function openPZ(src, title) {
      const content = document.getElementById('pz-content');
      const viewer  = document.getElementById('pz-viewer');
      document.getElementById('pz-title').textContent = title || 'Esquemático';

      content.innerHTML = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(0,217,176,.4);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase">Cargando…</div>';
      viewer.classList.add('open');

      const h = document.getElementById('pz-hint-bar');
      h.style.animation='none';
      void h.offsetWidth; h.style.animation='fadeHint 4s forwards';

      const isSVG = src.toLowerCase().endsWith('.svg');
      if(isSVG){
        let svgText;
        try {
          const res = await fetch(src);
          if(!res.ok) throw new Error(res.status);
          svgText = await res.text();
        } catch(e) {
          content.innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,140,42,.5);font-size:.8rem;padding:20px;text-align:center">Imagen no encontrada:<br><code style="font-size:.7rem;opacity:.7">${src}</code></div>`;
          return;
        }

        const parser = new DOMParser();
        const doc    = parser.parseFromString(svgText, 'image/svg+xml');
        pzSvgEl      = doc.documentElement;

        let w = 0, hh = 0;
        const vb = pzSvgEl.getAttribute('viewBox');
        if(vb){ const p=vb.trim().split(/[\s,]+/); w=parseFloat(p[2]); hh=parseFloat(p[3]); }
        if(!w||!hh){ w=parseFloat(pzSvgEl.getAttribute('width'))||1000; hh=parseFloat(pzSvgEl.getAttribute('height'))||700; }
        pzOrigW=w; pzOrigH=hh;

        pzSvgEl.setAttribute('width',  '100%');
        pzSvgEl.setAttribute('height', '100%');
        pzSvgEl.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        pzSvgEl.style.cssText = 'display:block;pointer-events:none;user-select:none;';
        
        pzVbX=0; pzVbY=0; pzVbW=pzOrigW; pzVbH=pzOrigH;
        pzSvgEl.setAttribute('viewBox', `0 0 ${pzOrigW} ${pzOrigH}`);
        content.innerHTML = '';
        content.appendChild(pzSvgEl);
        document.getElementById('pz-zoom-val').textContent = '100%';

      } else {
        const img = document.createElement('img');
        img.style.cssText = 'width:100%;height:100%;object-fit:contain;pointer-events:none;';
        content.innerHTML = '';
        content.appendChild(img);
        img.src = src;
      }
    }
    window.openPZ = openPZ;

    function closePZ() {
      document.getElementById('pz-viewer').classList.remove('open');
      document.getElementById('pz-content').innerHTML = '';
      pzSvgEl = null; pzOrigW = 0; pzOrigH = 0;
    }
    window.closePZ = closePZ;

    let pzSvgEl = null; 
    let pzOrigW = 0, pzOrigH = 0;
    let pzVbX = 0, pzVbY = 0, pzVbW = 0, pzVbH = 0;
    const PZ_ZOOM_F = 0.14;

    let _pzVBPending = false;
    function pzApplyVB(){
      if(!_pzVBPending){
        _pzVBPending = true;
        requestAnimationFrame(() => {
          _pzVBPending = false;
          if(pzSvgEl) pzSvgEl.setAttribute('viewBox', `${pzVbX} ${pzVbY} ${pzVbW} ${pzVbH}`);
          const lvl = pzOrigW > 0 ? Math.round(pzOrigW / pzVbW * 100) : 100;
          document.getElementById('pz-zoom-val').textContent = lvl + '%';
        });
      }
    }

    function pzFit() {
      pzVbX = 0; pzVbY = 0; pzVbW = pzOrigW; pzVbH = pzOrigH;
      pzApplyVB();
    }
    window.pzFit = pzFit;

    function pzZoomAt(factor, clientX, clientY) {
      const stage = document.getElementById('pz-stage');
      const rect  = stage.getBoundingClientRect();
      const rx = (clientX - rect.left) / rect.width;
      const ry = (clientY - rect.top)  / rect.height;
      const pivotX = pzVbX + rx * pzVbW;
      const pivotY = pzVbY + ry * pzVbH;
      const minW = pzOrigW / 10,  minH = pzOrigH / 10;
      const maxW = pzOrigW * 1, maxH = pzOrigH * 1;
      let nw = Math.max(minW, Math.min(maxW, pzVbW / factor));
      let nh = nw * (pzOrigH / pzOrigW);
      pzVbX = pivotX - rx * nw;
      pzVbY = pivotY - ry * nh;
      pzVbW = nw; pzVbH = nh;
      pzApplyVB();
    }

    function pzZoomBtn(f) {
      const stage = document.getElementById('pz-stage');
      const r = stage.getBoundingClientRect();
      pzZoomAt(f, r.left + r.width/2, r.top + r.height/2);
    }
    window.pzZoomBtn = pzZoomBtn;

    const pzStage = document.getElementById('pz-stage');
    let pzDrag = false, pzDSX = 0, pzDSY = 0, pzDVBX = 0, pzDVBY = 0;
    pzStage.addEventListener('wheel', e => {
      e.preventDefault(); e.stopPropagation();
      pzZoomAt(e.deltaY < 0 ? 1+PZ_ZOOM_F : 1-PZ_ZOOM_F, e.clientX, e.clientY);
    },{passive:false});

    pzStage.addEventListener('mousedown', e => {
      if(e.button!==0) return;
      e.preventDefault();
      pzDrag=true; pzDSX=e.clientX; pzDSY=e.clientY; pzDVBX=pzVbX; pzDVBY=pzVbY;
      pzStage.classList.add('dragging');
    });

    window.addEventListener('mousemove', e => {
      if(!pzDrag) return;
      const stage = document.getElementById('pz-stage');
      const rect  = stage.getBoundingClientRect();
      pzVbX = pzDVBX - (e.clientX-pzDSX) * (pzVbW/rect.width);
      pzVbY = pzDVBY - (e.clientY-pzDSY) * (pzVbH/rect.height);
      pzApplyVB();
    });

    window.addEventListener('mouseup', () => { pzDrag=false; pzStage.classList.remove('dragging'); });
    pzStage.addEventListener('dblclick', pzFit);

    let pzLastTap = 0, pzTDrag = false, pzTSX = 0, pzTSY = 0, pzTVBX = 0, pzTVBY = 0;
    let pzPD0 = 0, pzPVBX0 = 0, pzPVBY0 = 0, pzPVBW0 = 0, pzPVBH0 = 0;

    pzStage.addEventListener('touchstart', e => {
      e.preventDefault();
      if(e.touches.length === 1){
        pzTDrag=true; pzTSX=e.touches[0].clientX; pzTSY=e.touches[0].clientY;
        pzTVBX=pzVbX; pzTVBY=pzVbY;
        const now=Date.now(); if(now-pzLastTap<300) pzFit(); pzLastTap=now;
      } else if(e.touches.length === 2){
        pzTDrag=false;
        pzPD0 = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
        pzPVBX0=pzVbX; pzPVBY0=pzVbY; pzPVBW0=pzVbW; pzPVBH0=pzVbH;
      }
    },{passive:false});

    pzStage.addEventListener('touchmove', e => {
      e.preventDefault();
      if(e.touches.length===1 && pzTDrag){
        const stage=document.getElementById('pz-stage'), rect=stage.getBoundingClientRect();
        pzVbX = pzTVBX - (e.touches[0].clientX-pzTSX)*(pzVbW/rect.width);
        pzVbY = pzTVBY - (e.touches[0].clientY-pzTSY)*(pzVbH/rect.height);
        pzApplyVB();
      } else if(e.touches.length===2 && pzPD0){
        const nd = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
        const f  = nd/pzPD0;
        const mx = (e.touches[0].clientX+e.touches[1].clientX)/2;
        const my = (e.touches[0].clientY+e.touches[1].clientY)/2;
        const stage=document.getElementById('pz-stage'), rect=stage.getBoundingClientRect();
        const rx=(mx-rect.left)/rect.width, ry=(my-rect.top)/rect.height;
        let nw = pzPVBW0/f, nh = pzPVBH0/f;
        if(pzOrigW > 0){
          const minW=pzOrigW/10, maxW=pzOrigW*0.9;
          const minH=pzOrigH/10, maxH=pzOrigH*0.9;
          if(nw < minW){ nw=minW; nh=minH; }
          if(nw > maxW){ nw=maxW; nh=maxH; }
        }
        const pivX = pzPVBX0+rx*pzPVBW0, pivY = pzPVBY0+ry*pzPVBH0;
        pzVbX=pivX-rx*nw; pzVbY=pivY-ry*nh; pzVbW=nw; pzVbH=nh;
        pzApplyVB();
      }
    },{passive:false});

    pzStage.addEventListener('touchend', e => {
      if(e.touches.length===0){ pzTDrag=false; }
      if(e.touches.length<2){ pzPD0=0; }
    });

    // ═══════════════════════════════════════════════════════════════
    // COUNTER
    // ═══════════════════════════════════════════════════════════════
    function updateCounter() {
      const total = 10; 
      const count = seen ? seen.size : 0;
      const percent = (count / total) * 100;
      const circle = document.getElementById('progress-circle');
      if (circle) {
        const circumference = 2 * Math.PI * 16;
        const dash = (percent / 100) * circumference;
        circle.style.strokeDasharray = `${dash} ${circumference}`;
      }
      const txt = document.getElementById('counter-text');
      if (txt) txt.textContent = `${count}/${total}`;
    }

    // ═══════════════════════════════════════════════════════════════
    // HINT
    // ═══════════════════════════════════════════════════════════════
    let hintHidden = false;
    function hideHintOnInteraction() {
      if (!hintHidden) {
        document.getElementById('hint').style.opacity = '0';
        hintHidden = true;
      }
    }
    renderer.domElement.addEventListener('mousedown', hideHintOnInteraction);
    renderer.domElement.addEventListener('touchstart', hideHintOnInteraction);
    renderer.domElement.addEventListener('wheel', hideHintOnInteraction);

    window.addEventListener('keydown', e => {
      if(e.key==='Escape'){
        closePanel(); closePZ(); 
      }
    });

    document.getElementById('panel').addEventListener('wheel', (e) => e.stopPropagation(), { passive: false });
    document.getElementById('panel').addEventListener('touchmove', (e) => {
    e.stopPropagation();
    }, { passive: true });
    document.getElementById('pz-viewer').addEventListener('wheel', (e) => e.stopPropagation(), { passive: false });

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });

    // ═══════════════════════════════════════════════════════════════
    // ANIMATION LOOP
    // ═══════════════════════════════════════════════════════════════
    const clock = new THREE.Clock();
    let autoRot = true;
    const MODEL_COLLIDE = ZOOM_MIN;

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      if(!drag && !touchDrag) {
        model.rotation.y += .0012;
      }

      const camDist = camera.position.length();
      if(camDist < MODEL_COLLIDE) {
        camera.position.normalize().multiplyScalar(MODEL_COLLIDE);
      }

      if(selectedId === 'coil1' || selectedId === 'coil2') {
        const p = (.5+.5*Math.sin(t*8))*.4;
        clickables.filter(c=>c.id===selectedId).forEach(c=>{
          if(c.mesh.material.emissiveIntensity!==undefined)
            c.mesh.material.emissiveIntensity = p;
        });
      }

      pt1.intensity = .9 + .1*Math.sin(t*1.7);
      pt2.intensity = .5 + .08*Math.sin(t*2.3+1);

      renderer.render(scene,camera);
    }
    animate();

    // Inicializar contador
    updateCounter();
    
// ============================================================
// LÓGICA PARA CERRAR EL PANEL DESLIZANDO HACIA ABAJO (FLUIDO)
// ============================================================
const panelEl = document.getElementById('panel');
const piEl = panelEl.querySelector('.pi');
let startY = 0;
let currentY = 0;
let isDraggingPanel = false;

panelEl.addEventListener('touchstart', (e) => {
  if (window.innerWidth <= 768 && piEl.scrollTop <= 0) {
    startY = e.touches[0].clientY;
    currentY = startY;
    isDraggingPanel = true;
    
    // Quitamos la transición para que el panel siga tu dedo en tiempo real (cero lag)
    panelEl.style.transition = 'none'; 
  }
}, { passive: true });

panelEl.addEventListener('touchmove', (e) => {
  if (!isDraggingPanel || window.innerWidth > 768) return;
  
  currentY = e.touches[0].clientY;
  const deltaY = currentY - startY;

  if (deltaY > 0) {
    if (e.cancelable) e.preventDefault(); 
    panelEl.style.transform = `translateY(${deltaY}px)`;
  }
}, { passive: false });

panelEl.addEventListener('touchend', (e) => {
  if (!isDraggingPanel || window.innerWidth > 768) return;
  isDraggingPanel = false;

  const deltaY = currentY - startY;
  
  // 1. Forzamos la misma curva de animación (cubic-bezier) que ya tienes en tu CSS
  // para que el movimiento sea continuo y suave al soltar.
  panelEl.style.transition = 'transform 0.44s cubic-bezier(0.16, 1, 0.3, 1)'; 

  if (deltaY > 100) {
    // 2. Vaciamos el transform inline PRIMERO. Esto le entrega el control al CSS...
    panelEl.style.transform = ''; 
    // 3. ...y al llamar a closePanel(), el CSS lleva el panel hasta el fondo de forma fluida.
    closePanel(); 
  } else {
    // Si se deslizó poco, rebota suavemente a su lugar de origen
    panelEl.style.transform = '';
  }

  // 4. Limpiamos la transición inline una vez que termine la animación visual (440ms)
  setTimeout(() => {
    panelEl.style.transition = ''; 
  }, 440);
});
    
  </script>
